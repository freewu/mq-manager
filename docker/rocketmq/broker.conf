# Broker settings for the local RocketMQ fixture.
#
# `brokerIP1` is the address the broker *advertises* to clients and to the
# nameserver. It must be reachable from the machine running MQ Manager, so a
# broker running in a container publishes the host loopback address (the broker
# port is published to the host by docker compose).
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

brokerIP1 = 127.0.0.1
listenPort = 10911

# A single node cannot replicate, so keep everything on the master.
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# Convenient for a fixture: topics and consumer groups are created on demand,
# which is what makes the "produce" screen work without any setup.
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

deleteWhen = 04
fileReservedTime = 48
