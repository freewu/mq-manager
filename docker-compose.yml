# Local development fixtures. Nothing here ships with the app — they only exist
# so every driver can be exercised without a real cluster.
#
#   just kafka-up      single node Kafka (KRaft) plus a web UI
#   just rabbit-up     RabbitMQ with the management plugin
#   just rocket-up     RocketMQ nameserver + one broker
#
# `just all-up` starts everything. Point an MQ Manager connection at the
# localhost ports below (Kafka 9092, RabbitMQ 5672/15672, RocketMQ 9876).

# Pinned so the `*-reset` recipes can address the volumes by name.
name: mq-manager

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: mq-manager-kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single node: everything must fit on one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
        ]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mq-manager-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'

  rabbitmq:
    image: rabbitmq:4-management
    container_name: mq-manager-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672' # AMQP 0-9-1
      - '15672:15672' # management API (queue discovery and peeking)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: mq-manager-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - '9876:9876'
    environment:
      JAVA_OPT_EXT: '-Xms256m -Xmx256m -Xmn128m'
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: mq-manager-rocketmq-broker
    # Restarts until the nameserver is up: the broker exits when it cannot
    # register itself, which is normal for the first seconds of `just all-up`.
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_started
    # The config path follows the distribution inside the image tag above;
    # `brokerIP1` in it makes the host reach the broker.
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    ports:
      - '10909:10909'
      - '10911:10911'
    environment:
      JAVA_OPT_EXT: '-Xms512m -Xmx512m -Xmn256m'
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf:ro
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store

volumes:
  kafka-data:
  rabbitmq-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
